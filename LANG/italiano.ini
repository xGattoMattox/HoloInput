disclaimer.performance.text=L'overlay esegue in tempo reale il rendering 3D (accelerazione grafica tramite GPU) in sovrimpressione al gioco e rimane in esecuzione durante la partita: puo' quindi influire sulle prestazioni di gioco (frame rate, frame time, latenza degli input, utilizzo di CPU e GPU) in misura non quantificabile a priori, variabile in base a hardware, driver, impostazioni e gioco.
