setup.obs.howto.text=1.  Premere "Avvia il servizio": HoloInput scompare dallo schermo e invia a OBS l'immagine dei widget attraverso una connessione continua (WebSocket).\n2.  In OBS: Fonti > + > Browser. Come URL usare l'indirizzo qui sopra, come larghezza e altezza la risoluzione impostata qui sopra; spuntare "Usa frequenza fotogrammi personalizzata" con gli stessi fps e togliere "Spegni la fonte quando non visibile".\n3.  Con la risoluzione nativa del monitor i widget compaiono nella scena esattamente dove sono sullo schermo; se il canvas di OBS e' piu' piccolo, impostare qui la sua risoluzione (OBS: Impostazioni > Video > Risoluzione di base) e la disposizione viene scalata.\n4.  Per far ricomparire HoloInput premere Ctrl+Alt+F11: si apre questo Setup, da cui si ferma il servizio.
