setup.dev.axes.text=Tre indici separati da virgola: dicono quale asse fisico del dispositivo muove ogni movimento del modello 3D, nell'ordine\n   primo numero    = X  inclinazione sinistra / destra\n   secondo numero  = Y  inclinazione avanti / indietro\n   terzo numero    = Z  rotazione dell'impugnatura (twist)\nIndici degli assi di Windows: 0 = X   1 = Y   2 = Z   3 = R   4 = U   5 = V.\nEsempio "0,1,3": X dall'asse X, Y dall'asse Y, twist dall'asse R. Se il twist dello stick e' sull'asse Z scrivere "0,1,2".\nIl verso di ogni movimento (Inverti Si/No) e l'ampiezza si impostano nella pagina Ampiezza.
