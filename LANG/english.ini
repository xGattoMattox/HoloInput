setup.obs.howto.text=1.  Press "Start the service": HoloInput disappears from the screen and sends the image of the widgets to OBS through a continuous connection (WebSocket).\n2.  In OBS: Sources > + > Browser. Use the address above as URL and the resolution set above as width and height; tick "Use custom frame rate" with the same fps and untick "Shutdown source when not visible".\n3.  With the monitor's native resolution the widgets appear in the scene exactly where they are on the screen; if the OBS canvas is smaller, set its resolution here (OBS: Settings > Video > Base (Canvas) Resolution) and the layout is scaled.\n4.  To bring HoloInput back press Ctrl+Alt+F11: this Setup opens, and from here you can stop the service.
