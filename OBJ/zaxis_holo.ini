; Montaggio dell'impugnatura sulla prolunga asse Z (zaxis_holo.obj).
; Coordinate come si leggono in Blender (Z in alto) dopo File > Import > Wavefront (.obj)
; con le impostazioni standard. Punto decimale.
; Il file in OBJ\ accanto all'exe ha la precedenza su quello incorporato:
; si puo' cambiare l'inclinazione dell'impugnatura senza ricompilare.

[Montaggio]
; centro della faccia del collare superiore, dove si innesta il connettore dell'impugnatura
Punto=0.1270;0.0733;0.2942
; direzione in cui sale l'impugnatura: asse del collare superiore della prolunga
; (misurato sul modello: sale di circa 4 gradi sull'orizzontale)
Asse=-0.9741;-0.2168;0.0648
; in alternativa, stessa direzione ma inclinata di 45 gradi verso l'alto:
;Asse=-0.6902;-0.1536;0.7071
; rotazione dell'impugnatura attorno al proprio asse (gradi);
; 0 = impugnatura sinistra vpap_l_holo con lo slider frontale sul davanti (lontano dal pilota)
Rollio=0
